[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-acquisition"
version = "0.1.0"
description = "Provenance-preserving scholarly discovery, PDF acquisition and research archiving"
requires-python = ">=3.11,<3.12"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "defusedxml>=0.7,<1", "pypdf>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8"]
verification = ["pypdf>=5,<7"]

[project.scripts]
paper-acquisition = "paper_acquisition.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper_acquisition = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: optional real network requests (PAPER_LIVE=1)"]

[tool.ruff]
target-version = "py311"
line-length = 110
