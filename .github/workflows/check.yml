name: Public source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -c skill/literature-search-download/constraints-windows.txt ./vendor/literature-gain ./vendor/scanpdf . pytest wheel
      - run: python -m pytest tests -q
      - run: python -m pytest vendor/scanpdf/tests -q
      - run: python -m pytest vendor/literature-gain/tests -q -m "not live"
